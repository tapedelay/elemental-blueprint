<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090A">
<meta name="description" content="A self-knowledge instrument built on five behavioral patterns: how you love, work, and break.">
<title>Elemental Blueprint</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090A'/%3E%3Cpath d='M16 4 L27.4 12.3 L23.1 25.7 L8.9 25.7 L4.6 12.3 Z' fill='none' stroke='%23E8EDEA' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Elemental Blueprint · a scholar's instrument, night build
   Void black, phosphor ink, five bright mineral signals.
   Late-90s vector look: hard corners, aliased strokes, mono
   headings, faint scanlines. The data reads brightest; a color
   only ever means its element, and the Sheng ring carries the
   generative flow as gradients between neighbors.
   Token names kept from v1 (--paper is now the void, --ink the
   phosphor) so CONTENT and ENGINE stay untouched by the reskin.
   ============================================================ */
:root{
  --paper:#000000;
  --ink:#F4F7F5;
  --ink-70:rgba(244,247,245,.84);
  --ink-55:rgba(244,247,245,.70);
  --ink-25:rgba(244,247,245,.38);
  --ink-12:rgba(244,247,245,.22);
  --ink-07:rgba(244,247,245,.10);
  /* phosphor set: every one holds AA against true black */
  --wood:#54D298; --fire:#FF6247; --earth:#F6BC42; --metal:#AEC0C9; --water:#5CB4F5;
  --wood-t:var(--wood); --fire-t:var(--fire); --earth-t:var(--earth); --metal-t:var(--metal); --water-t:var(--water);
  --mono:'IBM Plex Mono','Cascadia Mono',Consolas,'Courier New',monospace;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --fast:160ms;
}
*{margin:0;padding:0;box-sizing:border-box}
html{forced-color-adjust:none;-webkit-text-size-adjust:100%;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
/* CRT scanlines, faint enough to feel rather than see */
body::after{content:"";position:fixed;inset:0;z-index:99;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
main#app{max-width:600px;margin:0 auto;padding:28px 20px 40px;min-height:72vh}
footer#foot{max-width:600px;margin:0 auto;padding:20px 20px 36px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* headings receive programmatic focus for screen readers; no visible ring */
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
::selection{background:var(--ink);color:var(--paper)}

.screen{animation:fin var(--fast) steps(3)}
.center{text-align:center}

/* type: mono carries the voice; body stays system sans */
.display{font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:700 11px/1.4 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-55)}
.micro{font:400 12px/1.6 var(--mono);color:var(--ink-55)}
h1.display{font-size:clamp(21px,6vw,29px);line-height:1.3}
h2.display{font-size:clamp(17px,4.6vw,21px);line-height:1.4}
p.lede{font-size:17px;color:var(--ink-70)}

/* buttons */
.btn{display:inline-block;font:700 13px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:0;
  padding:15px 28px;cursor:pointer;transition:background var(--fast),color var(--fast);touch-action:manipulation}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.3;cursor:default}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.btn.wide{width:100%;text-align:center}
.linkbtn{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-70);
  background:none;border:none;border-bottom:1px solid var(--ink-25);padding:4px 1px;cursor:pointer;transition:color var(--fast),border-color var(--fast)}
.linkbtn:hover{color:var(--ink);border-color:var(--ink)}

/* chips (about screen) */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 4px}
.chip{font:500 14px/1 var(--mono);color:var(--ink);background:transparent;border:1px solid var(--ink-25);
  border-radius:0;padding:13px 16px;cursor:pointer;min-height:44px;touch-action:manipulation;
  transition:background var(--fast),color var(--fast),border-color var(--fast)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{margin:26px 0}
.field .note{font-size:13px;color:var(--ink-55);margin-top:6px}
input.name{width:100%;font:400 18px/1.4 var(--body);color:var(--ink);background:transparent;
  border:none;border-bottom:2px solid var(--ink-25);border-radius:0;padding:9px 2px;transition:border-color var(--fast)}
input.name:focus{border-color:var(--ink)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.qnum{font:700 13px/1 var(--mono);letter-spacing:.12em;color:var(--ink-55)}
.dots{display:flex;gap:7px;justify-content:center;margin:16px 0 26px}
.dots i{width:7px;height:7px;background:var(--ink-12)}
.dots i.done{background:var(--ink-25)}
.dots i.on{background:var(--ink)}
.qtext{font-weight:600;font-size:clamp(18px,5vw,21px);line-height:1.45;margin:6px 0 22px}
.opt{display:block;width:100%;text-align:left;font:400 15.5px/1.45 var(--body);color:var(--ink);
  background:transparent;border:1px solid var(--ink-25);border-radius:0;padding:15px 76px 15px 34px;
  margin:10px 0;cursor:pointer;position:relative;min-height:52px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:border-color var(--fast),background var(--fast),box-shadow var(--fast)}
.opt::before{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font:700 14px/1 var(--mono);color:var(--ink)}
.opt:hover{border-color:var(--ink-70)}
/* Saturn mesh transparency on the picked answer */
.opt.pick{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);
  background-image:repeating-conic-gradient(rgba(244,247,245,.12) 0% 25%,transparent 0% 50%);
  background-size:4px 4px}
.opt.pick::before{content:">"}
.opt.also{border-color:var(--ink);border-style:dashed}
.opt.also::before{content:"+"}
.opt .tag{position:absolute;top:50%;right:12px;transform:translateY(-50%);
  font:700 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-70)}
.hint{font-size:12.5px;color:var(--ink-55);margin:14px 0 20px;font-family:var(--mono);line-height:1.7}
.qnav{display:flex;gap:12px;align-items:center;margin-top:6px}
.qnav .btn{flex:1}

/* pentagon: aliased vector wireframe. Ring segments carry the
   generative flow as color gradients; the data polygon is phosphor */
.penta{display:block;margin:0 auto}
.penta text{font-family:var(--mono)}
.penta .vname{font-size:10.5px;font-weight:700;letter-spacing:.18em}
.penta .vpct{font-size:20px;font-weight:700;fill:var(--ink)}
.penta .ringseg{stroke-width:2;shape-rendering:crispEdges}
.penta .chord{stroke:var(--ink);stroke-opacity:.15;stroke-width:1;shape-rendering:crispEdges}
.penta .poly{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:miter;shape-rendering:crispEdges}
.penta .facet{shape-rendering:crispEdges}
.penta .spoke{stroke:rgba(244,247,245,.28);stroke-width:1;shape-rendering:crispEdges}
.penta .vsq{shape-rendering:crispEdges}
.penta.animate .ringseg{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .3s linear forwards}
.penta.animate .chord{opacity:0;animation:fin .4s ease 1.05s forwards}
.penta.animate .datapoly{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.55);
  animation:pop .7s cubic-bezier(.2,.8,.3,1) 1.35s forwards}
.penta.animate .vlabel{opacity:0;animation:fin .5s ease 1.35s forwards}

/* matches */
.matchrow{border-bottom:1px solid var(--ink-12)}
.matchhead{width:100%;display:grid;grid-template-columns:30px 1fr auto;grid-template-areas:"rank name score" "rank tier score";
  align-items:center;column-gap:12px;row-gap:2px;background:none;border:none;color:var(--ink);text-align:left;padding:12px 0;cursor:pointer}
.matchhead:hover .mname{text-decoration:underline}
.mrank{grid-area:rank;font-size:12px;color:var(--ink-55)}
.mname{grid-area:name;font:700 13px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.mscore{grid-area:score;font-size:24px;font-weight:700}
.mtier{grid-area:tier;font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-55)}
.matchdetail{padding:4px 0 18px 42px}
@media(max-width:480px){.matchdetail{padding-left:0}}

/* saved results */
.savedlist{margin-top:12px;border-top:1px solid var(--ink-12)}
.savedrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ink-12)}
.savedopen{flex:1;text-align:left;border:none;display:flex;flex-direction:column;gap:4px;text-transform:none;letter-spacing:.04em}
.savedopen b{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.savedmeta{font-size:11px;color:var(--ink-55)}
.savedacts{display:flex;gap:12px;flex-shrink:0}
.savedacts .linkbtn{font-size:10.5px}

/* element crystal + boot: lo-poly software render, scaled up crunchy */
canvas.crystal,canvas.orbit{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
canvas.orbit{width:100%;max-width:560px;aspect-ratio:150/84;height:auto}
#boot{position:fixed;inset:0;z-index:98;background:var(--paper);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;cursor:pointer}
#boot.out{animation:fout .24s steps(3) forwards}
.boottitle{font-size:clamp(17px,5vw,24px);white-space:nowrap;overflow:hidden;width:0;
  animation:type .9s steps(19) .7s forwards}
.bootsub{opacity:0;animation:blink 1s steps(1) 1.5s infinite}
.btn.start::before{content:"> ";animation:blink 1.1s steps(1) infinite}
@keyframes type{to{width:calc(19ch + 1.9em)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes fout{to{opacity:0}}
@media (prefers-reduced-motion: reduce){.btn.start::before{animation:none}}

/* reveal sequencing */
.fin{opacity:0;animation:fin .55s ease var(--d,0s) forwards}
.revealname{font-size:clamp(34px,10vw,48px);line-height:1.15;letter-spacing:.14em}
.statechip{display:inline-block;font:700 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;
  border:2px solid var(--ink);padding:8px 14px}
.portrait{font-size:16.5px;line-height:1.75;color:var(--ink);text-align:left;margin:22px auto;max-width:52ch}

/* blueprint */
.bphead{text-align:center;margin-bottom:8px}
.bpname{font-size:clamp(27px,8vw,38px);letter-spacing:.14em}
.section{margin:34px 0}
.rule{width:28px;height:3px;margin:8px 0 12px}
.card{border:1px solid var(--ink-25);padding:16px 18px}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:540px){.cols{grid-template-columns:1fr 1fr}}
ul.plain{list-style:none}
ul.plain li{position:relative;padding:5px 0 5px 16px;font-size:15px;line-height:1.55}
ul.plain li::before{content:"";position:absolute;left:0;top:.8em;width:5px;height:5px;background:var(--ink-55)}
ol.practices{list-style:none;counter-reset:pr}
ol.practices li{counter-increment:pr;position:relative;padding:10px 0 10px 40px;font-size:15.5px;line-height:1.65;border-top:1px solid var(--ink-12)}
ol.practices li:first-child{border-top:none}
ol.practices li::before{content:"0" counter(pr);position:absolute;left:0;top:12px;
  font:700 13px/1 var(--mono);color:var(--ink-55);letter-spacing:.05em}
.stressname{font:700 13px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;margin-bottom:8px}

/* ask: local Claude companion */
.askrow{display:flex;gap:10px;margin-top:14px}
.drow{display:flex;align-items:center;gap:16px;margin-top:12px}
.drow .lbl{width:72px;margin:0}
.dnum{width:110px}
.askin{flex:1;min-width:0;font:400 15px/1.4 var(--body);color:var(--ink);background:transparent;
  border:1px solid var(--ink-25);border-radius:0;padding:13px 14px;transition:border-color var(--fast)}
.askin:focus{border-color:var(--ink)}
.btn.sm{padding:13px 18px}
.askq{font:500 13px/1.6 var(--mono);color:var(--ink-70);margin:18px 0 8px;overflow-wrap:break-word}
.aska{border-left:2px solid var(--ink-25);padding:2px 0 2px 14px;font-size:15.5px;line-height:1.7}
.aska p{margin-bottom:10px}
.aska p:last-child{margin-bottom:0}
.pcard{border:1px solid var(--ink-25);padding:18px;margin-top:16px}
.dyadnums{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0 16px}
.dn .micro{display:block;margin-bottom:4px}
.dn b{font:700 26px/1.1 var(--mono);color:var(--ink)}

/* footer */
footer#foot{border-top:1px solid var(--ink-12)}
.footrow{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:14px}
.disclaimer{font-size:11.5px;line-height:1.7;color:var(--ink-55);font-family:var(--mono)}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font:700 12px/1 var(--mono);letter-spacing:.08em;padding:12px 18px;z-index:100;
  animation:fin .2s ease}
#toast[hidden]{display:none}

@keyframes fin{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}

/* ============================================================
   LOOKS · html[data-look] is "retro" (default) or "modern".
   Retro: Saturn/PS1 lo-poly plates, mesh-dither fills, hard
   offset slabs, segmented rules, aliased mono. Modern: the same
   app clean and minimal, sans throughout, rounded, smooth.
   ============================================================ */
#top{max-width:600px;margin:0 auto;padding:14px 20px 0;display:flex;justify-content:flex-end}
.looksw{display:inline-flex;border:1px solid var(--ink-25)}
.looksw button{font:700 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);
  background:transparent;border:none;padding:0 13px;min-height:36px;cursor:pointer;transition:color var(--fast),background var(--fast)}
.looksw button:hover{color:var(--ink)}
.looksw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* retro: everything is a lo-poly plate */
html[data-look="retro"] .display,html[data-look="retro"] .lbl,html[data-look="retro"] .mono,
html[data-look="retro"] .btn,html[data-look="retro"] .looksw button{-webkit-font-smoothing:none}
html[data-look="retro"] .btn{box-shadow:4px 4px 0 rgba(244,247,245,.22)}
html[data-look="retro"] .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(244,247,245,.22)}
html[data-look="retro"] .chip{box-shadow:3px 3px 0 rgba(244,247,245,.1)}
html[data-look="retro"] .opt{box-shadow:3px 3px 0 rgba(244,247,245,.07)}
html[data-look="retro"] .opt.pick{box-shadow:inset 0 0 0 1px var(--ink),3px 3px 0 rgba(244,247,245,.18)}
html[data-look="retro"] .statechip{box-shadow:3px 3px 0 rgba(244,247,245,.2)}
html[data-look="retro"] .card,html[data-look="retro"] .pcard{
  background-image:repeating-conic-gradient(rgba(244,247,245,.04) 0% 25%,transparent 0% 50%);background-size:4px 4px;
  box-shadow:inset 1px 1px 0 rgba(244,247,245,.12),4px 4px 0 rgba(244,247,245,.07)}
html[data-look="retro"] .rule{width:36px;height:4px;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
html[data-look="retro"] .section>.lbl::before{content:"";display:inline-block;width:6px;height:6px;margin-right:9px;
  background:currentColor;vertical-align:1px}
html[data-look="retro"] .askin{background-image:repeating-conic-gradient(rgba(244,247,245,.03) 0% 25%,transparent 0% 50%);background-size:4px 4px}
html[data-look="retro"] .looksw{box-shadow:3px 3px 0 rgba(244,247,245,.1)}
.qcrystal{display:inline-block;vertical-align:middle}

/* modern: clean, minimal, smooth */
html[data-look="modern"]{--paper:#0B0C0E;--mono:var(--body)}
html[data-look="modern"] body::after{display:none}
html[data-look="modern"] .screen{animation:fin .22s ease}
html[data-look="modern"] #boot{display:none}
html[data-look="modern"] .display{text-transform:none;letter-spacing:-.01em;font-weight:650}
html[data-look="modern"] h1.display{font-size:clamp(26px,7vw,36px)}
html[data-look="modern"] .revealname,html[data-look="modern"] .bpname{letter-spacing:-.015em}
html[data-look="modern"] .lbl{font-size:11.5px;letter-spacing:.07em;font-weight:600}
html[data-look="modern"] .micro{font-size:13px;line-height:1.55}
html[data-look="modern"] .btn{border:none;border-radius:999px;background:var(--ink);color:var(--paper);
  text-transform:none;letter-spacing:0;font-size:15px;font-weight:600;padding:15px 28px}
html[data-look="modern"] .btn:hover{background:#fff;color:var(--paper)}
html[data-look="modern"] .btn:disabled:hover{background:var(--ink);color:var(--paper)}
html[data-look="modern"] .btn.sm{padding:13px 20px}
html[data-look="modern"] .btn.start::before{content:none}
html[data-look="modern"] .linkbtn{text-transform:none;letter-spacing:0;font-size:13.5px;border-bottom-color:transparent}
html[data-look="modern"] .linkbtn:hover{border-bottom-color:var(--ink-55)}
html[data-look="modern"] .chip{border-radius:999px;border-color:var(--ink-12);background:rgba(255,255,255,.03)}
html[data-look="modern"] .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
html[data-look="modern"] .opt{border-radius:14px;border-color:var(--ink-12);background:rgba(255,255,255,.025);padding-left:18px}
html[data-look="modern"] .opt::before{content:none}
html[data-look="modern"] .opt:hover{border-color:var(--ink-25)}
html[data-look="modern"] .opt.pick{background:rgba(255,255,255,.1);background-image:none;box-shadow:none;border-color:var(--ink-55)}
html[data-look="modern"] .opt.also{border-style:solid;border-color:var(--ink-25);background:rgba(255,255,255,.05)}
html[data-look="modern"] .opt .tag{letter-spacing:.04em;text-transform:none;font-size:11.5px}
html[data-look="modern"] .card,html[data-look="modern"] .pcard{border-radius:16px;border-color:var(--ink-12);background:rgba(255,255,255,.03)}
html[data-look="modern"] .statechip{border-radius:999px;border-width:1px;letter-spacing:.08em}
html[data-look="modern"] .rule{border-radius:2px}
html[data-look="modern"] .dots i{border-radius:50%}
html[data-look="modern"] .askin{border-radius:12px;border-color:var(--ink-12);background:rgba(255,255,255,.03)}
html[data-look="modern"] ul.plain li::before{border-radius:50%}
html[data-look="modern"] .penta .ringseg,html[data-look="modern"] .penta .chord,html[data-look="modern"] .penta .poly,
html[data-look="modern"] .penta .facet,html[data-look="modern"] .penta .spoke,html[data-look="modern"] .penta .vsq,
html[data-look="modern"] .penta line,html[data-look="modern"] .penta polygon{shape-rendering:geometricPrecision}
html[data-look="modern"] .penta .poly{stroke-linejoin:round}
html[data-look="modern"] .penta .vsq{rx:3.5px}
html[data-look="modern"] .penta .vname{letter-spacing:.06em}
html[data-look="modern"] canvas.crystal,html[data-look="modern"] canvas.orbit{image-rendering:auto}
html[data-look="modern"] .mname,html[data-look="modern"] .savedopen b{text-transform:none;letter-spacing:0;font-size:15px}
html[data-look="modern"] .mtier{text-transform:none;letter-spacing:0;font-size:12.5px}
html[data-look="modern"] .stressname,html[data-look="modern"] .qnum{letter-spacing:.06em}
html[data-look="modern"] .looksw{border-radius:999px;padding:3px;border-color:var(--ink-12);background:rgba(255,255,255,.04)}
html[data-look="modern"] .looksw button{border-radius:999px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;min-height:32px}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<footer id="foot"></footer>
<div id="toast" hidden></div>

<script>
"use strict";
/* ================================================================
   CONTENT · every user-visible string lives here.
   Copy edits must never require touching the ENGINE or UI below.
   ================================================================ */
const CONTENT = {

  meta: {
    app: "Elemental Blueprint",
    tagline: "A pattern language for how you love, work, and break.",
    landingNote: "Three minutes · Nothing leaves this device",
    disclaimer: "A self-reflection tool. Not a psychological assessment, diagnosis, or advice.",
    privacyNote: "All data stays on this device.",
    bootLine: "Five patterns · reading"
  },

  landing: {
    directLink: "Enter numbers directly",
    codeLink: "Paste a blueprint code",
    codeButton: "Load",
    codeBad: "That code did not read. Check it and try again.",
    savedLabel: "Saved results",
    readTag: "your read",
    currentTag: "open",

/* ================================================================
   ENGINE · pure functions only. No DOM, no storage, no side effects.

   Two documented interpretations where the spec is silent:
   1. "Also me" answers count toward maturity hits at weight 1
      (picks count at weight 2), mirroring the 2/1 point split.
   2. `overall` is normalized over the elements that have valenced
      hits: sum(pct*maturity) / sum(pct). Without this, an element
      scored only through neutral options would silently drag a
      mature profile toward Reactive.
   ================================================================ */
const ELS = ["wood", "fire", "earth", "metal", "water"];
const THRESH = { secondary: 0.18, grounded: 0.62, reactive: 0.42 };

function optionByElement(qid, el) {
  const q = CONTENT.questions.find(function (q) { return q.id === qid; });
  if (!q) return null;
  return q.options.find(function (o) { return o.el === el; }) || null;
}

function round2(v) { return Math.round(v * 100) / 100; }

/* Largest-remainder rounding so displayed percentages sum to 100. */
function roundPcts(pctF) {
  const rows = ELS.map(function (e) {
    const v = (pctF[e] || 0) * 100;
    return { e: e, fl: Math.floor(v), rem: v - Math.floor(v) };
  });
  const out = {};
  let used = rows.reduce(function (t, r) { return t + r.fl; }, 0);
  if (used === 0 && rows.every(function (r) { return r.rem === 0; })) {
    rows.forEach(function (r) { out[r.e] = 0; });
    return out;
  }
  let left = 100 - used;
  rows.slice().sort(function (a, b) {
    return b.rem - a.rem || ELS.indexOf(a.e) - ELS.indexOf(b.e);
  }).forEach(function (r) { r.add = left > 0 ? 1 : 0; if (left > 0) left--; });
  rows.forEach(function (r) { out[r.e] = r.fl + (r.add || 0); });
  return out;
}

/* Reactivity from the stress check: 0 (rarely) .. 1 (most days).
   Weighted toward the user's own strong elements, since their shadow
   patterns are the ones that run the show, with an unweighted floor. */
function reactivityOf(lately, pctF) {
  if (!lately) return null;
  let weighted = 0, mean = 0;
  for (let i = 0; i < ELS.length; i++) {
    const v = Number(lately[ELS[i]]);
    if (!(v >= 0 && v <= 3)) return null; /* incomplete check: ignore it */
    weighted += (pctF[ELS[i]] || 0) * v / 3;
    mean += v / 3 / ELS.length;
  }
  return 0.6 * weighted + 0.4 * mean;
}

/* answers: [{ q, pick, also? }] with valences derived from CONTENT.
   lately (optional): { element: 0..3 } from the stress check. With it,
   overall = half answer-valence maturity, half (1 - reactivity); the
   bank alone barely moves state (most questions share one valence
   across all five options), so the check is what makes state real. */
function scoreAnswers(answers, lately) {
  const pts = {}, mHits = {}, sHits = {};
  ELS.forEach(function (e) { pts[e] = 0; mHits[e] = 0; sHits[e] = 0; });
  let total = 0;

  answers.forEach(function (a) {
    const pickOpt = optionByElement(a.q, a.pick);
    if (!pickOpt) return;
    pts[a.pick] += 2; total += 2;
    if (pickOpt.val === "M") mHits[a.pick] += 2;
    else if (pickOpt.val === "S") sHits[a.pick] += 2;

    if (a.also && a.also !== a.pick) {
      const alsoOpt = optionByElement(a.q, a.also);
      if (alsoOpt) {
        pts[a.also] += 1; total += 1;
        if (alsoOpt.val === "M") mHits[a.also] += 1;
        else if (alsoOpt.val === "S") sHits[a.also] += 1;
      }
    }
  });

  const pctF = {};
  ELS.forEach(function (e) { pctF[e] = total > 0 ? pts[e] / total : 0; });

  const order = ELS.slice().sort(function (a, b) {
    return pctF[b] - pctF[a] || ELS.indexOf(a) - ELS.indexOf(b);
  });
  const primary = order[0];
  const secondary = pctF[order[1]] >= THRESH.secondary ? order[1] : null;

  const perElement = {};
  let num = 0, den = 0;
  ELS.forEach(function (e) {
    const hits = mHits[e] + sHits[e];
    if (hits > 0) {
      const m = mHits[e] / hits;
      perElement[e] = round2(m);
      num += pctF[e] * m;
      den += pctF[e];
    }
  });
  const valenceF = den > 0 ? num / den : 0.5;
  const react = reactivityOf(lately, pctF);
  const overallF = react == null ? valenceF : 0.5 * valenceF + 0.5 * (1 - react);
  const state = overallF >= THRESH.grounded ? "grounded"
              : overallF <= THRESH.reactive ? "reactive"
              : "integrating";

  return {
    pct: roundPcts(pctF),
    pctF: pctF,
    primary: primary,
    secondary: secondary,
    maturity: { overall: round2(overallF), overallF: overallF, perElement: perElement },
    state: state
  };
}

/* A tie is judged at display resolution: when the rounded percentages
   are equal, any order between the top two would be an artifact of the
   canonical element list, so both are presented as primary. Computed
   from pct on demand rather than stored, so old saves and shared codes
   pick it up with no migration. */
function isCoPrimary(s) {
  return !!(s && s.secondary && s.pct && s.pct[s.primary] === s.pct[s.secondary]);
}

/* Direct entry: build a scores object from hand-set weights. There is
   no per-answer valence data, so maturity.overall is a representative
   midpoint of the chosen state band and perElement stays empty. */
function manualScores(weights, state) {
  const w = {};
  let total = 0;
  ELS.forEach(function (e) {
    w[e] = Math.max(0, Number(weights[e]) || 0);
    total += w[e];
  });
  if (total <= 0) return null;
  const pctF = {};
  ELS.forEach(function (e) { pctF[e] = w[e] / total; });
  const order = ELS.slice().sort(function (a, b) {
    return pctF[b] - pctF[a] || ELS.indexOf(a) - ELS.indexOf(b);
  });
  const st = state === "grounded" || state === "reactive" ? state : "integrating";
  const overallF = { grounded: 0.72, integrating: 0.52, reactive: 0.32 }[st];
  return {
    pct: roundPcts(pctF),
    pctF: pctF,
    primary: order[0],
    secondary: pctF[order[1]] >= THRESH.secondary ? order[1] : null,
    maturity: { overall: round2(overallF), overallF: overallF, perElement: {} },
    state: st
  };
}

/* The stored/shareable shape from SPEC section 5 (derived floats stripped). */
function publicScores(s) {
  return {
    pct: s.pct,
    primary: s.primary,
    secondary: s.secondary,
    maturity: { overall: s.maturity.overall, perElement: s.maturity.perElement },
    state: s.state
  };
}

function encodeBlueprint(s) {
  const json = JSON.stringify(publicScores(s));
  const b64 = btoa(json).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return "EB1." + b64;
}

function decodeBlueprint(code) {
  const m = /^EB1\.([A-Za-z0-9_-]+)$/.exec(String(code || "").trim());
  if (!m) return null;
  let j = null;
  try { j = JSON.parse(atob(m[1].replace(/-/g, "+").replace(/_/g, "/"))); }
  catch (e) { return null; }
  if (!j || !j.pct || ELS.indexOf(j.primary) < 0) return null;
  if (j.secondary != null && (ELS.indexOf(j.secondary) < 0 || j.secondary === j.primary)) return null;
  if (!j.maturity || typeof j.maturity.overall !== "number") return null;
  if (!{ grounded: 1, integrating: 1, reactive: 1 }[j.state]) return null;
  /* every real producer emits all five keys summing to 100 via roundPcts */
  let pctSum = 0;
  const pctOk = ELS.every(function (e) {
    const v = j.pct[e];
    if (typeof v !== "number" || !isFinite(v) || v < 0 || v > 100) return false;
    pctSum += v;
    return true;
  });
  if (!pctOk || Math.round(pctSum) !== 100) return null;
  return hydrateScores(j);
}

/* ---- Phase 2 seed: relations and dyad scoring (SPEC section 4) ----
   Base relation table + state blend only; the age and polarity
   modifiers apply to the ranked 25-combo matching, not to a
   specific-person read. The subject's maturity state is never
   assessed: the blend uses the user's own state. */
const GEN = { wood: "fire", fire: "earth", earth: "metal", metal: "water", water: "wood" };
const KE  = { wood: "earth", earth: "water", water: "fire", fire: "metal", metal: "wood" };
const REL = {
  P_GENERATES_U: { stab: 95, chem: 60 },
  U_GENERATES_P: { stab: 85, chem: 55 },
  SAME:          { stab: 70, chem: 50 },
  U_CONTROLS_P:  { stab: 45, chem: 80 },
  P_CONTROLS_U:  { stab: 30, chem: 95 }
};

function relationOf(p, u) {
  if (p === u) return "SAME";
  if (GEN[p] === u) return "P_GENERATES_U";
  if (GEN[u] === p) return "U_GENERATES_P";
  if (KE[p] === u) return "P_CONTROLS_U";
  return "U_CONTROLS_P";
}

function dyadScore(user, person) {
  const p1 = person.primary;
  const p2 = person.secondary || person.primary; /* doubles count as pure */
  const S = function (u, p) { return REL[relationOf(p, u)].stab; };
  const C = function (u, p) { return REL[relationOf(p, u)].chem; };
  /* exact ties get symmetric weight instead of canonical-order bias */
  const pw = isCoPrimary(person) ? 0.5 : 0.7;
  const su = function (u) { return pw * S(u, p1) + (1 - pw) * S(u, p2); };
  const cu = function (u) { return pw * C(u, p1) + (1 - pw) * C(u, p2); };
  let stab, chem;
  if (isCoPrimary(user)) {
    stab = 0.5 * su(user.primary) + 0.5 * su(user.secondary);
    chem = 0.5 * cu(user.primary) + 0.5 * cu(user.secondary);
  } else {
    stab = su(user.primary);
    chem = cu(user.primary);
    if (user.secondary) {
      stab = 0.8 * stab + 0.2 * S(user.secondary, p1);
      chem = 0.8 * chem + 0.2 * C(user.secondary, p1);
    }
  }
  const W = { grounded: [0.75, 0.25], integrating: [0.55, 0.45], reactive: [0.30, 0.70] }[user.state] || [0.55, 0.45];
  const raw = Math.max(0, Math.min(100, W[0] * stab + W[1] * chem));
  const relation = relationOf(p1, user.primary);
  return {
    relation: relation,
    raw: raw,
    stab: Math.round(stab),
    chem: Math.round(chem),
    score: Math.round(raw),
    tier: tierOf(raw),
    trap: relation === "P_CONTROLS_U" && user.state === "reactive"
  };
}

function tierOf(raw) {
  return raw >= 85 ? "cobuilder" : raw >= 70 ? "growth" : raw >= 55 ? "workable" : raw >= 40 ? "effortful" : "volatile";
}

/* Ranked matching (SPEC section 4): one hypothetical partner combo,
   optionally scored under another state (the Hold uses Grounded), with
   the age-band and polarity modifiers that a specific-person read
   deliberately omits. */
function comboScore(user, p1, p2, profile, stateOverride) {
  const st = stateOverride || user.state;
  const u = Object.assign({}, user, { state: st });
  const d = dyadScore(u, { primary: p1, secondary: p1 === p2 ? null : p2 });
  let raw = d.raw;
  const pr = profile || {};
  const young = pr.ageBand === "18-26" || pr.ageBand === "27-33";
  if (young && (p1 === "wood" || p1 === "fire")) raw *= 1.08;
  if (pr.ageBand === "38+" && (p1 === "earth" || p1 === "metal")) raw *= 1.08;
  if (pr.polarity === "direction") raw *= p1 === "metal" ? 1.10 : p1 === "wood" ? 1.05 : 1;
  if (pr.polarity === "flow") raw *= (p1 === "earth" || p1 === "water") ? 1.10 : p1 === "fire" ? 1.05 : 1;
  raw = Math.max(0, Math.min(100, raw));
  return {
    p1: p1, p2: p2, relation: d.relation, stab: d.stab, chem: d.chem,
    raw: raw, score: Math.round(raw), tier: tierOf(raw),
    trap: d.relation === "P_CONTROLS_U" && st === "reactive"
  };
}

/* All 25 combos, best first. pull = the user's actual state, hold = Grounded. */
function rankMatches(user, profile) {
  function ranked(st) {
    const out = [];
    ELS.forEach(function (p1) { ELS.forEach(function (p2) { out.push(comboScore(user, p1, p2, profile, st)); }); });
    return out.sort(function (a, b) {
      return b.raw - a.raw || ELS.indexOf(a.p1) - ELS.indexOf(b.p1) || ELS.indexOf(a.p2) - ELS.indexOf(b.p2);
    });
  }
  return { pull: ranked(user.state), hold: ranked("grounded") };
}

function fill(tpl, vars) {
  return String(tpl).replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; });
}

/* Key into CONTENT.combos: primary-secondary, pure when there is no secondary */
function comboKey(s) {
  return s.primary + "-" + (s.secondary || s.primary);
}

/* The written pairing report: you and them are scores objects (primary
   and secondary are read), names are display strings. Pure: returns
   strings. Their combo profile leads What works / Where it grinds; the
   relation supplies the rest, so each of the 25 partner patterns reads
   differently even when two share a primary. */
function pairingReport(you, them, youName, themName) {
  const R = CONTENT.report;
  const P = CONTENT.combos[comboKey(them)], Y = CONTENT.combos[comboKey(you)];
  const rel = relationOf(them.primary, you.primary);
  const byRel = R.byRelation[rel];
  const en = function (e) { return CONTENT.elements[e].name; };
  const stress = you.primary === them.primary
    ? fill(R.stressSame, { a: R.stressVerbPlural[you.primary] })
    : fill(R.stressPair, { A: youName, a: R.stressVerb[you.primary], B: themName, b: R.stressVerb[them.primary] });
  return {
    relation: rel,
    profiles: [
      { who: themName, el: them.primary, name: P.name, sketch: P.sketch },
      { who: youName, el: you.primary, name: Y.name, sketch: Y.sketch }
    ],
    strengths: [P.gives].concat(byRel.strengths.slice(0, 2)),
    frictions: [P.grinds, byRel.frictions[0], stress],
    reach: [
      { who: themName, el: them.primary, text: P.script },
      { who: youName, el: you.primary, text: Y.script }
    ],
    /* a shared primary would print the same line twice: say it once, for both */
    needs: you.primary === them.primary
      ? [fill(R.needsLine, { name: youName + R.bothJoin + themName + " (" + en(you.primary) + ")", need: R.needs[you.primary] })]
      : [
          fill(R.needsLine, { name: youName + " (" + en(you.primary) + ")", need: R.needs[you.primary] }),
          fill(R.needsLine, { name: themName + " (" + en(them.primary) + ")", need: R.needs[them.primary] })
        ],
    repair: you.primary === them.primary
      ? [{ who: youName + R.bothJoin + themName, el: you.primary, text: R.repair[you.primary] }]
      : [
          { who: youName, el: you.primary, text: R.repair[you.primary] },
          { who: themName, el: them.primary, text: R.repair[them.primary] }
        ]
  };
}

/* Cycle edges between two people's elements: primaries always, plus
   each secondary against the other's primary. Directed by Sheng (feeds)
   or Ke (checks); a shared element is "same". */
function cycleEdges(a, b) {
  const pairs = [[a.primary, b.primary, true]];
  if (b.secondary) pairs.push([a.primary, b.secondary, false]);
  if (a.secondary) pairs.push([a.secondary, b.primary, false]);
  return pairs.map(function (pr) {
    const x = pr[0], y = pr[1];
    if (x === y) return { kind: "same", from: "a", fe: x, to: "b", te: y, major: pr[2] };
    if (GEN[x] === y) return { kind: "feeds", from: "a", fe: x, to: "b", te: y, major: pr[2] };
    if (GEN[y] === x) return { kind: "feeds", from: "b", fe: y, to: "a", te: x, major: pr[2] };
    if (KE[x] === y) return { kind: "checks", from: "a", fe: x, to: "b", te: y, major: pr[2] };
    return { kind: "checks", from: "b", fe: y, to: "a", te: x, major: pr[2] };
  });
}

/* Parse a persona reading returned by the companion: tolerate prose
   around the JSON, renormalize pct to 100, and always retype
   primary/secondary from the numbers rather than trusting labels. */
/* Model text passes through here before display: the copy rules ban
   em dashes, and hard truncation can leave dangling punctuation. */
function cleanStr(x, max) {
  return String(x).replace(/\s*[–—]\s*/g, "; ").slice(0, max)
    .replace(/[\s;,:]+$/, "");
}

function parsePersona(text) {
  const s = String(text).indexOf("{"), e = String(text).lastIndexOf("}");
  if (s < 0 || e <= s) return null;
  let j = null;
  try { j = JSON.parse(String(text).slice(s, e + 1)); } catch (err) { return null; }
  if (j && j.error) return { error: String(j.error) };
  if (!j || !j.pct) return null;
  const pf = {};
  let sum = 0;
  ELS.forEach(function (el) {
    const v = Math.max(0, Number(j.pct[el]) || 0);
    pf[el] = v;
    sum += v;
  });
  if (sum <= 0) return null;
  const pctF = {};
  ELS.forEach(function (el) { pctF[el] = pf[el] / sum; });
  const order = ELS.slice().sort(function (a, b) {
    return pctF[b] - pctF[a] || ELS.indexOf(a) - ELS.indexOf(b);
  });
  return {
    name: cleanStr(j.name || "", 60),
    knownFor: cleanStr(j.knownFor || "", 160),
    evidence: (Array.isArray(j.evidence) ? j.evidence : []).slice(0, 5).map(function (x) { return cleanStr(x, 220); }),
    caveat: cleanStr(j.caveat || "", 200),
    scores: {
      pct: roundPcts(pctF),
      pctF: pctF,
      primary: order[0],
      secondary: pctF[order[1]] >= THRESH.secondary ? order[1] : null
    }
  };
}

function esc(str) {

function shuffle(arr) {

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------- storage (guarded for private-mode failures) ---------- */
let memStore = null;
function saveAll() {
  const payload = {
    profile: UI.profile,
    answers: answerArray(),
    lately: UI.lately,
    observed: !!UI.observed,
    scores: publicScores(UI.scores),
    results: { ranked: [], computedAt: "" },
    meta: { version: 1 }
  };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(payload)); }
  catch (e) { memStore = payload; }
}
function loadAll() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* fall through */ }
  return memStore;
}
function eraseAll() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  try { localStorage.removeItem(PROFILES_KEY); } catch (e) { /* ignore */ }
  memStore = null;
  memProfiles = null;
}

/* ---------- saved results: nothing is ever silently lost ---------- */
const PROFILES_KEY = "eb.profiles.v1";
let memProfiles = null; /* same session-survival fallback as memStore */
function loadProfiles() {
  try {
    const raw = localStorage.getItem(PROFILES_KEY);
    if (raw) {
      const a = JSON.parse(raw);
      /* hand-edited or partial entries must never break the landing */
      if (Array.isArray(a)) {
        return a.filter(function (p) {
          return p && p.scores && ELS.indexOf(p.scores.primary) >= 0 &&
            (p.scores.secondary == null || ELS.indexOf(p.scores.secondary) >= 0);
        });
      }
    }
  } catch (e) { /* fall through */ }
  return memProfiles || [];
}
function saveProfiles(list) {
  const trimmed = list.slice(-12);
  try { localStorage.setItem(PROFILES_KEY, JSON.stringify(trimmed)); }
  catch (e) { memProfiles = trimmed; }
}
/* Keep the active result before anything replaces it. Deduped by code,
   so re-loading or re-entering the same result never piles up copies. */
function stashCurrent() {
  if (!UI.scores) return false;
  const code = encodeBlueprint(UI.scores);
  const list = loadProfiles();
  if (list.some(function (p) { return p.code === code; })) return false;
  list.push({
    name: UI.profile.name || "",
    observed: !!UI.observed,
    code: code,
    scores: publicScores(UI.scores),
    savedAt: new Date().toISOString().slice(0, 10)
  });
  saveProfiles(list);
  return true;
}
/* Make a scores object the active result (direct entry, code, profile). */
function adoptScores(scores, name, observed) {
  const kept = stashCurrent();
  UI.scores = scores;
  UI.observed = !!observed;
  if (typeof name === "string") UI.profile.name = name; /* "" clears it */
  UI._persona = null; /* any dyad belonged to the previous result */
  saveAll();
  stashCurrent(); /* every active result is listed, so it can be renamed or compared */
  go("blueprint");
  if (kept) toast(CONTENT.footer.stashToast);
}

function answerArray() {
  return CONTENT.questions
    .filter(function (q) { return UI.picks[q.id]; })
    .map(function (q) {
      const pick = UI.picks[q.id];
      const opt = optionByElement(q.id, pick);
      const row = { q: q.id, pick: pick, pickValence: opt ? opt.val : "N" };
      if (UI.alsos[q.id]) row.also = UI.alsos[q.id];
      return row;
    });
}

/* Rebuild derived floats when loading the stored public shape. */
function hydrateScores(stored) {
  const pctF = {};
  ELS.forEach(function (e) { pctF[e] = (stored.pct[e] || 0) / 100; });
  return {
    pct: stored.pct, pctF: pctF,
    primary: stored.primary, secondary: stored.secondary,
    maturity: {
      overall: stored.maturity.overall,
      overallF: stored.maturity.overall,
      perElement: stored.maturity.perElement
    },
    state: stored.state
  };
}

/* ---------- pentagon SVG ----------
   Vertex order clockwise from the top follows the Sheng ring:
   Fire > Earth > Metal > Water > Wood. Each ring segment is a
   gradient from the element it leaves to the element it feeds,
   so the generative cycle reads as color flow. The Ke star is
   the dim chords; the user's data polygon is phosphor white. */
let svgUid = 0;
function pentagonSVG(scores, opts) {
  opts = opts || {};
  const animate = !!opts.animate && !RM;
  const labels = opts.labels !== false;
  const VORDER = ["fire", "earth", "metal", "water", "wood"];
  const cx = 180, cy = 186, R = 116, LR = R + 36;
  const verts = VORDER.map(function (e, i) {
    const a = (-90 + i * 72) * Math.PI / 180;
    return {
      e: e,
      x: cx + R * Math.cos(a), y: cy + R * Math.sin(a),
      lx: cx + LR * Math.cos(a), ly: cy + LR * Math.sin(a)
    };
  });
  const f = function (n) { return n.toFixed(1); };
  const uid = "eb" + (++svgUid) + "g";

  let defs = "<defs>";
  let ring = "";
  for (let i = 0; i < 5; i++) {
    const a = verts[i], b = verts[(i + 1) % 5];
    const gid = uid + i;
    defs += '<linearGradient id="' + gid + '" gradientUnits="userSpaceOnUse" x1="' + f(a.x) +
      '" y1="' + f(a.y) + '" x2="' + f(b.x) + '" y2="' + f(b.y) + '">' +
      '<stop offset="0" stop-color="var(--' + a.e + ')"/>' +
      '<stop offset="1" stop-color="var(--' + b.e + ')"/></linearGradient>';
    ring += '<line class="ringseg" x1="' + f(a.x) + '" y1="' + f(a.y) +
      '" x2="' + f(b.x) + '" y2="' + f(b.y) + '" stroke="url(#' + gid + ')" pathLength="100"' +
      (animate ? ' style="animation-delay:' + (0.15 + i * 0.16).toFixed(2) + 's"' : "") + "/>";
  }
  defs += "</defs>";

  let chords = "";
  for (let i = 0; i < 5; i++) {
    const a = verts[i], b = verts[(i + 2) % 5];
    chords += '<line class="chord" x1="' + f(a.x) + '" y1="' + f(a.y) +
      '" x2="' + f(b.x) + '" y2="' + f(b.y) + '"/>';
  }

  let poly = "";
  if (scores) {
    /* Saturn-style lo-poly: the data shape is five flat facets
       (center > vertex i > vertex i+1), each shaded by the mean
       share of the two elements it spans, plus wireframe spokes.
       The flat shading is literally the data. */
    const dp = verts.map(function (v) {
      const r = Math.max(0.03, scores.pctF[v.e] || 0) * R;
      const a = Math.atan2(v.y - cy, v.x - cx);
      return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    });
    let facets = "", spokes = "";
    for (let i = 0; i < 5; i++) {
      const a = dp[i], b = dp[(i + 1) % 5];
      const share = ((scores.pctF[verts[i].e] || 0) + (scores.pctF[verts[(i + 1) % 5].e] || 0)) / 2;
      const alpha = Math.min(0.6, 0.05 + 0.6 * share).toFixed(3);
      facets += '<polygon class="facet" points="' + cx + ',' + cy + ' ' + f(a.x) + ',' + f(a.y) +
        ' ' + f(b.x) + ',' + f(b.y) + '" fill="rgba(244,247,245,' + alpha + ')"/>';
      spokes += '<line class="spoke" x1="' + cx + '" y1="' + cy + '" x2="' + f(a.x) + '" y2="' + f(a.y) + '"/>';
    }
    const pts = dp.map(function (p) { return f(p.x) + "," + f(p.y); }).join(" ");
    poly = '<g class="datapoly">' + facets + spokes + '<polygon class="poly" points="' + pts + '"/></g>';
  }

  let labelsSvg = "";
  if (labels) {
    verts.forEach(function (v) {
      const sq = '<rect class="vsq" x="' + f(v.x - 3.5) + '" y="' + f(v.y - 3.5) +
        '" width="7" height="7" fill="var(--' + v.e + ')"/>';
      let txt = "";
      if (scores) {
        /* data-count only exists in animate mode, so a stale
           reveal timer can never touch a static chart */
        const pctText = animate
          ? '<text class="vpct" x="' + f(v.lx) + '" y="' + f(v.ly + 13) +
            '" text-anchor="middle" data-count="' + scores.pct[v.e] + '">0%</text>'
          : '<text class="vpct" x="' + f(v.lx) + '" y="' + f(v.ly + 13) +
            '" text-anchor="middle">' + scores.pct[v.e] + "%</text>";
        txt = '<g class="vlabel"><text class="vname" x="' + f(v.lx) + '" y="' + f(v.ly - 9) +
          '" text-anchor="middle" fill="var(--' + v.e + ')">' + CONTENT.elements[v.e].name.toUpperCase() +
          "</text>" + pctText + "</g>";
      } else {
        txt = '<text class="vname vlabel" x="' + f(v.lx) + '" y="' + f(v.ly + 4) +
          '" text-anchor="middle" fill="var(--' + v.e + ')">' + CONTENT.elements[v.e].name.toUpperCase() + "</text>";
      }
      labelsSvg += sq + txt;
    });
  }

  const size = opts.size || 340;
  return '<svg class="penta' + (animate ? " animate" : "") + '" viewBox="0 0 360 372" ' +
    'style="width:min(86vw,' + size + 'px)" role="img" aria-label="' + esc(opts.aria || CONTENT.reveal.chartAria) + '">' +
    defs + ring + chords + poly + labelsSvg + "</svg>";
}

/* ---------- element crystal: a lo-poly software render ----------
   A pentagonal bipyramid, one equator vertex per element in Sheng
   order, rasterized by hand into a tiny ImageData (flat shading,
   z-buffer, integer-snapped vertices so it wobbles like 32-bit
   hardware) and posterized through a 4x4 Bayer dither, then scaled
   up with pixelated sampling. With scores, each equator vertex
   reaches out by that element's share: the crystal's shape is the
   data, and each facet carries the colors of the two elements it
   spans, so a color still only ever means its element. */
/* ---------- look: retro (default) or modern, a per-viewer preference ---------- */
const LOOK_KEY = "eb.look";
function isModern() { return document.documentElement.dataset.look === "modern"; }
function storedLook() {
  try { return localStorage.getItem(LOOK_KEY) === "modern" ? "modern" : "retro"; }
  catch (e) { return "retro"; }
}
function renderLook() {
  const L = CONTENT.look;
  const cur = isModern() ? "modern" : "retro";
  $("#top").innerHTML = '<div class="looksw" role="group" aria-label="' + L.aria + '">' +
    ["retro", "modern"].map(function (v) {
      return '<button type="button" data-look="' + v + '" aria-pressed="' + (cur === v) + '">' + L[v] + "</button>";
    }).join("") + "</div>";
  document.querySelectorAll("#top [data-look]").forEach(function (b) {
    b.addEventListener("click", function () { setLook(b.dataset.look); });
  });
}
function setLook(v) {
  if ((isModern() ? "modern" : "retro") === v) return;
  try { localStorage.setItem(LOOK_KEY, v); } catch (e) { /* session-only then */ }
  document.documentElement.dataset.look = v;
  renderLook();
  /* canvases are sized per look, so the screen redraws; keep the
     reader's place, an open comparison, and focus on the switch */
  /* the two looks lay out at different heights, so anchor on the first
     block still on screen rather than on a pixel offset */
  const blocks = function () { return Array.prototype.slice.call(document.querySelectorAll("#app .section, #app .card, #app h1, #app h2")); };
  const before = blocks();
  let ai = before.findIndex(function (el) { return el.getBoundingClientRect().bottom > 0; });
  const atop = ai >= 0 ? before[ai].getBoundingClientRect().top : 0;
  const cmp = UI._cmp;
  render();
  if (cmp && cmp.scores === UI.scores && $("#cmpbox")) renderCompare.apply(null, cmp.args);
  const after = blocks();
  if (ai >= 0 && after[ai]) window.scrollTo(0, window.scrollY + after[ai].getBoundingClientRect().top - atop);
  const btn = $('#top [data-look="' + v + '"]');
  if (btn) btn.focus({ preventScroll: true });
}

const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
let crystalRGB = null;
function elementRGB() {
  if (crystalRGB) return crystalRGB;
  const cs = getComputedStyle(document.documentElement);
  crystalRGB = {};
  ELS.forEach(function (e) {
    const h = cs.getPropertyValue("--" + e).trim().replace("#", "");
    crystalRGB[e] = [0, 2, 4].map(function (i) { return parseInt(h.slice(i, i + 2), 16) || 200; });
  });
  return crystalRGB;
}

/* Equator reach per element, in crystal vertex order; neutral without scores */
function crystalRadii(scores) {
  const order = ["fire", "earth", "metal", "water", "wood"];
  if (!scores || !scores.pct) return order.map(function () { return 1; });
  const mx = Math.max.apply(null, order.map(function (e) { return scores.pct[e] || 0; })) || 1;
  return order.map(function (e) { return round2(0.42 + 1.05 * (scores.pct[e] || 0) / mx); });
}

function crystalHTML(scores, opts) {
  opts = opts || {};
  const size = opts.size || 160;
  /* retro renders tiny and scales up crunchy; modern renders at device resolution */
  const res = isModern() ? Math.min(440, Math.round(size * Math.min(2, window.devicePixelRatio || 1)))
    : (opts.res || Math.round(size / 2.6));
  const radii = crystalRadii(scores);
  return '<canvas class="crystal" width="' + res + '" height="' + res + '" data-r="' + radii.join(",") +
    '" data-dir="' + (opts.dir || 1) + '" style="width:' + size + "px;height:" + size + 'px" role="img" aria-label="' +
    esc(opts.aria || "Element crystal") + '"></canvas>';
}

const CRYSTAL_ORDER = ["fire", "earth", "metal", "water", "wood"];

/* View-space vertices for one crystal: rotation, then a translation. */
function crystalVerts(radii, t, dir, s, off) {
  const V = [];
  for (let i = 0; i < 5; i++) {
    const a = (-90 + i * 72) * Math.PI / 180;
    V.push([Math.cos(a) * radii[i] * s, 0, Math.sin(a) * radii[i] * s]);
  }
  V.push([0, 1.3 * s, 0]);   /* 5: crown */
  V.push([0, -1.05 * s, 0]); /* 6: pavilion */
  const ry = t * 0.55 * dir, rx = 0.38 + Math.sin(t * 0.7) * 0.06;
  const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
  const o = off || [0, 0, 0];
  return V.map(function (v) {
    const x1 = v[0] * cy + v[2] * sy, z1 = -v[0] * sy + v[2] * cy;
    const y2 = v[1] * cx - z1 * sx, z2 = v[1] * sx + z1 * cx;
    return [x1 + o[0], y2 + o[1], z2 + o[2]];
  });
}

/* Rasterize one crystal into a shared frame {px, zb, w, h, F, D}.
   Returns the integer-snapped screen points (index 0..4 = elements). */
function rasterCrystal(fr, W) {
  const RGB = elementRGB();
  const w = fr.w, h = fr.h, px = fr.px, zb = fr.zb, D = fr.D, F = fr.F;
  /* integer snap: no subpixel precision, the period-correct wobble */
  const P = W.map(function (v) {
    const k = F / (v[2] + D);
    return [Math.round(w / 2 + v[0] * k), Math.round(h / 2 - v[1] * k + h * 0.02), v[2]];
  });
  const L = [-0.45, 0.7, -0.55];
  const ln = Math.hypot(L[0], L[1], L[2]);
  for (let i = 0; i < 5; i++) {
    const j = (i + 1) % 5;
    [[5, i, j], [6, j, i]].forEach(function (f) {
      const a = W[f[0]], b = W[f[1]], c = W[f[2]];
      const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
      let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      const nl = Math.hypot(n[0], n[1], n[2]) || 1;
      n = [n[0] / nl, n[1] / nl, n[2] / nl];
      /* face the camera (it looks down +z): flip rather than trust winding */
      const ctr = [(a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3, (a[2] + b[2] + c[2]) / 3 + D];
      if (n[0] * ctr[0] + n[1] * ctr[1] + n[2] * ctr[2] > 0) n = [-n[0], -n[1], -n[2]];
      const lit = 0.26 + 0.9 * Math.max(0, (n[0] * L[0] + n[1] * L[1] + n[2] * L[2]) / ln);
      const ca = RGB[CRYSTAL_ORDER[i]], cb = RGB[CRYSTAL_ORDER[j]];
      const col = [0, 1, 2].map(function (k) { return Math.min(255, (ca[k] + cb[k]) / 2 * lit); });
      const p0 = P[f[0]], p1 = P[f[1]], p2 = P[f[2]];
      const area = (p1[0] - p0[0]) * (p2[1] - p0[1]) - (p1[1] - p0[1]) * (p2[0] - p0[0]);
      if (area === 0) return;
      const minX = Math.max(0, Math.min(p0[0], p1[0], p2[0])), maxX = Math.min(w - 1, Math.max(p0[0], p1[0], p2[0]));
      const minY = Math.max(0, Math.min(p0[1], p1[1], p2[1])), maxY = Math.min(h - 1, Math.max(p0[1], p1[1], p2[1]));
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const qx = x + 0.5, qy = y + 0.5;
          const w0 = ((p1[0] - qx) * (p2[1] - qy) - (p1[1] - qy) * (p2[0] - qx)) / area;
          const w1 = ((p2[0] - qx) * (p0[1] - qy) - (p2[1] - qy) * (p0[0] - qx)) / area;
          const w2 = 1 - w0 - w1;
          if (w0 < 0 || w1 < 0 || w2 < 0) continue;
          const z = w0 * p0[2] + w1 * p1[2] + w2 * p2[2];
          const idx = y * w + x;
          if (z >= zb[idx]) continue;
          zb[idx] = z;
          const o = idx * 4;
          if (fr.dither) {
            const th = (BAYER4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
            for (let k = 0; k < 3; k++) {
              const q = col[k] / 255 * 4; /* 5 levels per channel */
              const fl = Math.floor(q);
              px[o + k] = Math.min(4, fl + (q - fl > th ? 1 : 0)) * 63.75;
            }
          } else {
            px[o] = col[0]; px[o + 1] = col[1]; px[o + 2] = col[2];
          }
          px[o + 3] = 255;
        }
      }
    });
  }
  return P;
}

function plotPx(fr, x, y, c) {
  if (x < 0 || y < 0 || x >= fr.w || y >= fr.h) return;
  const o = (y * fr.w + x) * 4;
  fr.px[o] = c[0]; fr.px[o + 1] = c[1]; fr.px[o + 2] = c[2]; fr.px[o + 3] = 255;
}

/* element vertex markers, front half only: same squares as the pentagon */
function crystalMarkers(fr, W, P) {
  const RGB = elementRGB();
  for (let i = 0; i < 5; i++) {
    if (W[i][2] > W[5][2] + 0.15) continue;
    const k = Math.max(1, Math.round(fr.w / 48));
    for (let dy = -k; dy < k; dy++) for (let dx = -k; dx < k; dx++) plotPx(fr, P[i][0] + dx, P[i][1] + dy, RGB[CRYSTAL_ORDER[i]]);
  }
}

/* A dithered Bresenham line: solid-ish for "feeds", dashed for "checks" */
function ditherLine(fr, a, b, c, dashed, faint) {
  let x0 = a[0], y0 = a[1];
  const x1 = b[0], y1 = b[1];
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, n = 0;
  const sc = Math.max(1, Math.round(fr.w / 150)); /* dash length and weight track resolution */
  for (;;) {
    const on = dashed ? (n % (6 * sc)) < 3 * sc : true;
    if (on && (!faint || ((x0 + y0) & 1) === 0)) {
      plotPx(fr, x0, y0, c);
      if (sc > 1 && !faint) { plotPx(fr, x0 + 1, y0, c); plotPx(fr, x0, y0 + 1, c); }
    }
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
    n++;
  }
}

function newFrame(ctx, w, h, F, D) {
  const img = ctx.createImageData(w, h);
  return { img: img, px: img.data, zb: new Float32Array(w * h).fill(1e9), w: w, h: h, F: F, D: D, dither: !isModern() };
}

function drawCrystal(cv, t, scale) {
  const ctx = cv.getContext("2d");
  const N = cv.width;
  const radii = cv.dataset.r.split(",").map(Number);
  const dir = Number(cv.dataset.dir) || 1;
  const fr = newFrame(ctx, N, N, N * 1.65, 4.6);
  const W = crystalVerts(radii, t, dir, scale == null ? 1 : scale);
  crystalMarkers(fr, W, rasterCrystal(fr, W));
  ctx.putImageData(fr.img, 0, 0);
}

/* Orbit scene: two crystals circle a shared center, and the cycle edges
   between their elements are drawn as dithered lines, colored by the
   element doing the feeding or checking. */
function orbitHTML(a, b, edges, aria) {
  const k = isModern() ? 4 : 1;
  return '<canvas class="orbit" width="' + 150 * k + '" height="' + 84 * k + '" data-ra="' + crystalRadii(a).join(",") +
    '" data-rb="' + crystalRadii(b).join(",") +
    "\" data-edges='" + JSON.stringify(edges) + "' role=\"img\" aria-label=\"" + esc(aria) + '"></canvas>';
}

function drawOrbit(cv, t) {
  const ctx = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  const fr = newFrame(ctx, w, h, h * 1.5, 5.2);
  const ra = cv.dataset.ra.split(",").map(Number), rb = cv.dataset.rb.split(",").map(Number);
  const th = t * 0.45;
  const offA = [Math.cos(th) * 1.3, 0, Math.sin(th) * 0.8];
  const offB = [-offA[0], 0, -offA[2]];
  const WA = crystalVerts(ra, t, 1, 0.62, offA), WB = crystalVerts(rb, t, -1, 0.62, offB);
  const PA = rasterCrystal(fr, WA), PB = rasterCrystal(fr, WB);
  crystalMarkers(fr, WA, PA);
  crystalMarkers(fr, WB, PB);
  const RGB = elementRGB();
  JSON.parse(cv.dataset.edges).forEach(function (e) {
    const pf = e.from === "a" ? PA : PB, pt = e.to === "a" ? PA : PB;
    const fi = CRYSTAL_ORDER.indexOf(e.fe), ti = CRYSTAL_ORDER.indexOf(e.te);
    ditherLine(fr, pf[fi], pt[ti], RGB[e.fe], e.kind === "checks", !e.major);
  });
  ctx.putImageData(fr.img, 0, 0);
}

/* Spin every not-yet-mounted crystal on screen until the screen changes */
function mountCrystals() {
  const gen = UI._gen;
  const items = Array.prototype.slice.call(document.querySelectorAll("canvas.crystal:not([data-live]), canvas.orbit:not([data-live])"));
  if (!items.length) return;
  items.forEach(function (cv) { cv.dataset.live = "1"; });
  const t0 = performance.now();
  let live = items;
  function frame(now) {
    if (UI._gen !== gen) return;
    /* partial redraws (each quiz pick) detach canvases without a new screen */
    live = live.filter(function (cv) { return cv.isConnected; });
    if (!live.length) return;
    const t = (now - t0) / 1000 + 1.2;
    live.forEach(function (cv) {
      if (cv.classList.contains("orbit")) drawOrbit(cv, t); else drawCrystal(cv, t);
    });
    if (!RM) requestAnimationFrame(frame);
  }
  frame(t0); /* first frame now: a hidden tab never shows an empty box */
}

/* Boot: a short console-style power-on, once per session, skippable */
function bootSequence() {
  let seen = false;
  try { seen = sessionStorage.getItem("eb.boot") === "1"; sessionStorage.setItem("eb.boot", "1"); }
  catch (e) { /* storage blocked: just boot every time */ }
  if (RM || seen || isModern()) return;
  const el = document.createElement("div");
  el.id = "boot";
  el.innerHTML = crystalHTML(null, { size: 200, res: 64, aria: "" }) +
    '<p class="display boottitle">' + CONTENT.meta.app + "</p>" +
    '<p class="micro bootsub">' + CONTENT.meta.bootLine + "</p>";
  document.body.appendChild(el);
  const cv = el.querySelector("canvas");
  cv.dataset.live = "1";
  const t0 = performance.now();
  let done = false;
  function frame(now) {
    if (done) return;
    const t = (now - t0) / 1000;
    const k = Math.min(1, t / 1.1);
    const ease = 1 - Math.pow(1 - k, 3);
    /* assembles from a point while spinning down to cruise speed */
    drawCrystal(cv, t + (1 - ease) * 3.2, Math.max(0.05, ease));
    requestAnimationFrame(frame);
  }
  frame(t0);
  function finish() {
    if (done) return;
    done = true;
    el.classList.add("out");
    setTimeout(function () { el.remove(); }, 260);
  }
  el.addEventListener("click", finish);
  window.addEventListener("keydown", finish, { once: true });
  setTimeout(finish, 2300);
}

/* ---------- screens ---------- */

  UI.screen = screen;

function render() {
  /* invalidate any timers/rAF loops the previous screen left behind */
  UI._gen = (UI._gen || 0) + 1;
  (UI._timers || []).forEach(clearTimeout);
  UI._timers = [];
  /* companion requests are scoped to a screen; a new screen gets fresh forms */
  UI._askBusy = false;
  UI._personaBusy = false;
  window.scrollTo(0, 0);
  const fn = {
    landing: renderLanding, framing: renderFraming, about: renderAbout,
    quiz: renderQuiz, reveal: renderReveal, blueprint: renderBlueprint,
    direct: renderDirect, lately: renderLately

  fn();

function renderQuiz() {
  const q = CONTENT.questions[UI.qIndex];
  if (!UI.optionOrder[q.id]) {
    UI.optionOrder[q.id] = shuffle(q.options.map(function (o) { return o.el; }));
  }
  const order = UI.optionOrder[q.id];
  const obs = UI.profile.subject === "other";
  const nn = function (n) { return (n < 10 ? "0" : "") + n; };

  const dots = CONTENT.questions.map(function (_, i) {
    return "<i" + (i === UI.qIndex ? ' class="on"' : (i < UI.qIndex ? ' class="done"' : "")) + "></i>";
  }).join("");

  const opts = order.map(function (el) {
    const o = q.options.find(function (o) { return o.el === el; });
    const isPick = UI.picks[q.id] === el;
    const isAlso = UI.alsos[q.id] === el;
    const cls = "opt" + (isPick ? " pick" : "") + (isAlso ? " also" : "");
    const tag = isPick ? '<span class="tag">' + CONTENT.quiz.pickTag + "</span>"
             : isAlso ? '<span class="tag">' + CONTENT.quiz.alsoTag + "</span>" : "";
    return '<button class="' + cls + '" data-el="' + el + '" aria-pressed="' + isPick + '">' +
      esc(obs && o.o ? o.o : o.text) + tag + "</button>";
  }).join("");

  $("#app").innerHTML =
    '<div class="screen">' +
      '<div class="qhead">' +
        '<button class="linkbtn" id="back">' + CONTENT.quiz.back + "</button>" +
        liveCrystalHTML() +
        '<span class="qnum" aria-label="Question ' + (UI.qIndex + 1) + " " + CONTENT.quiz.counterOf + " " + CONTENT.questions.length + '">' +
          nn(UI.qIndex + 1) + " / " + nn(CONTENT.questions.length) + "</span>" +
      "</div>" +
      '<div class="dots" aria-hidden="true">' + dots + "</div>" +
      (obs ? '<p class="lbl" style="margin-bottom:6px">' + esc(UI.profile.name) + "</p>" : "") +
      '<h2 class="qtext">' + esc(obs && q.other ? q.other : q.text) + "</h2>" +
      "<div>" + opts + "</div>" +
      '<p class="hint">' + CONTENT.quiz.hint + "</p>" +
      '<div class="qnav"><button class="btn wide" id="next"' + (UI.picks[q.id] ? "" : " disabled") + ">" +
        CONTENT.quiz.next +
      "</button></div>" +
    "</div>";

  function setPick(el) {
    UI.picks[q.id] = el;
    if (UI.alsos[q.id] === el) delete UI.alsos[q.id];
    renderQuiz();
  }
  function toggleAlso(el) {
    if (UI.picks[q.id] === el) return;
    if (UI.alsos[q.id] === el) delete UI.alsos[q.id];
    else UI.alsos[q.id] = el;
    renderQuiz();
  }

  document.querySelectorAll(".opt").forEach(function (btn) {
    const el = btn.dataset.el;
    let timer = null;
    btn.addEventListener("pointerdown", function () {
      UI._suppressClick = false;
      timer = setTimeout(function () {
        /* toggleAlso re-renders and replaces this node, so the flag
           must outlive it: the trailing click lands on the fresh
           node and is swallowed there */
        UI._suppressClick = true;
        toggleAlso(el);
      }, 450);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
      btn.addEventListener(ev, function () { clearTimeout(timer); });
    });
    btn.addEventListener("click", function () {
      if (UI._suppressClick) { UI._suppressClick = false; return; }
      setPick(el);
    });
    btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    btn.addEventListener("keydown", function (e) {
      if (e.key === "a" || e.key === "A") { e.preventDefault(); toggleAlso(el); }
    });
  });

  mountCrystals();
  $("#back").addEventListener("click", function () {
    if (UI.qIndex > 0) { UI.qIndex--; renderQuiz(); renderFooter(); }
    else go("about");
  });
  $("#next").addEventListener("click", function () {
    if (!UI.picks[q.id]) return;
    if (UI.qIndex < CONTENT.questions.length - 1) { UI.qIndex++; renderQuiz(); renderFooter(); }
    else go("lately");
  });
}

        secondaryLine +

          '<p style="max-width:46ch;margin:14px auto 0;color:var(--ink-70);font-size:14.5px;line-height:1.7">' + st.gloss + "</p></div>" +
        '<p class="portrait fin" style="--d:3.4s">' + (name ? esc(name) + ". " : "") + (co ? r.coPrimaryGloss : el.portrait) + "</p>" +
        '<div class="fin" style="--d:3.8s;margin-top:8px"><button class="btn" id="open">' + r.button + "</button></div>" +
      "</div>" +
    "</div>";

  if (!RM) {
    const gen = UI._gen;
    UI._timers.push(setTimeout(function () {
      const nodes = Array.prototype.slice.call(document.querySelectorAll("[data-count]"));
      const t0 = performance.now(), dur = 950;
      function step(t) {
        if (UI._gen !== gen) return; /* screen changed; stop */
        const k = Math.min(1, (t - t0) / dur);
        const ease = 1 - Math.pow(1 - k, 3);
        nodes.forEach(function (n) {
          n.textContent = Math.round(ease * Number(n.dataset.count)) + "%";
        });
        if (k < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
      /* rAF can be suspended (hidden tab, some webviews); always settle */
      UI._timers.push(setTimeout(function () {
        nodes.forEach(function (n) { n.textContent = n.dataset.count + "%"; });
      }, dur + 300));
    }, 1400));
  }
  $("#open").addEventListener("click", function () { go("blueprint"); });
}

function renderMatches() {
  const box = $("#matchbox");
  if (!box) return;
  const M = CONTENT.matches;
  const rk = rankMatches(UI.scores, UI.profile);
  const grounded = UI.scores.state === "grounded";
  const view = grounded ? "hold" : (UI._matchView || "pull");
  const list = rk[view];
  const all = !!UI._matchAll;
  const row = function (m, rank) {
    const key = m.p1 + "-" + m.p2;
    const open = UI._matchOpen === key;
    let detail = "";
    if (open) {
      const partner = { primary: m.p1, secondary: m.p1 === m.p2 ? null : m.p2 };
      const you = UI.profile.name || CONTENT.compare.unnamedSelf;
      detail = '<div class="matchdetail"><p style="font-size:15px">' + CONTENT.relations[m.relation] + "</p>" +
        '<div class="dyadnums">' +
          '<div class="dn"><span class="micro">' + CONTENT.persona.stability + "</span><b>" + m.stab + "</b></div>" +
          '<div class="dn"><span class="micro">' + CONTENT.persona.chemistry + "</span><b>" + m.chem + "</b></div>" +
        "</div>" +
        reportHTML(pairingReport(UI.scores, partner, you, fill(M.partner, { combo: comboText(m) })), { partnerOnly: true }) + "</div>";
    }
    return '<div class="matchrow' + (open ? " open" : "") + '">' +
      '<button class="matchhead" data-match="' + key + '" aria-expanded="' + open + '">' +
        '<span class="mono mrank">' + (rank < 9 ? "0" : "") + (rank + 1) + "</span>" +
        '<span class="mname">' + comboName(m) + "</span>" +
        '<span class="mono mscore">' + m.score + "</span>" +
        '<span class="mtier">' + CONTENT.tiers[m.tier] + (m.trap ? " · " + CONTENT.persona.trapBadge : "") + "</span>" +
      "</button>" + detail + "</div>";
  };
  const rows = function (items, offset) { return items.map(function (m, i) { return row(m, offset + i); }).join(""); };
  const toggle = grounded ? "" :
    '<div class="chips" style="margin-top:14px" id="mtoggle">' +
      '<button class="chip" data-view="pull" aria-pressed="' + (view === "pull") + '">' + M.pull + "</button>" +
      '<button class="chip" data-view="hold" aria-pressed="' + (view === "hold") + '">' + M.hold + "</button>" +
    "</div>";
  const gloss = grounded
    ? fill(M.groundedNote, { combo: comboText(rankMatches(Object.assign({}, UI.scores, { state: "reactive" }), UI.profile).pull[0]) })
    : (view === "pull" ? M.pullGloss : M.holdGloss) + " " + M.gapNote;
  box.innerHTML = toggle +
    '<p class="micro" style="margin-top:10px">' + esc(gloss) + "</p>" +
    (all
      ? '<p class="lbl" style="margin-top:18px">' + M.all + "</p>" + rows(list, 0)
      : '<p class="lbl" style="margin-top:18px">' + M.top + "</p>" + rows(list.slice(0, 5), 0) +
        '<p class="lbl" style="margin-top:22px">' + M.bottom + "</p>" + rows(list.slice(-5), 20)) +
    '<div class="footrow" style="margin-top:14px"><button class="linkbtn" id="mall">' + (all ? M.showLess : M.showAll) + "</button></div>";
  box.querySelectorAll("[data-view]").forEach(function (b) {
    b.addEventListener("click", function () { UI._matchView = b.dataset.view; renderMatches(); });
  });
  box.querySelectorAll("[data-match]").forEach(function (b) {
    b.addEventListener("click", function () {
      UI._matchOpen = UI._matchOpen === b.dataset.match ? null : b.dataset.match;
      renderMatches();
    });
  });
  $("#mall").addEventListener("click", function () { UI._matchAll = !all; renderMatches(); });
}

/* ---------- save as image: a pixel-art card, drawn on canvas ---------- */
function saveCardImage(kind) {
  const W = 1080, H = 1350;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const cs = getComputedStyle(document.documentElement);
  const col = function (e) { return cs.getPropertyValue("--" + e).trim() || "#F4F7F5"; };
  const modern = isModern();
  const INK = "#F4F7F5", DIM = "rgba(244,247,245,.6)";
  const MONO = modern ? "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    : "'IBM Plex Mono','Cascadia Mono',Consolas,'Courier New',monospace";
  g.fillStyle = modern ? "#0B0C0E" : "#000"; g.fillRect(0, 0, W, H);
  g.imageSmoothingEnabled = modern;
  const text = function (str, x, y, size, color, weight, align, spacing) {
    g.font = (weight || 700) + " " + size + "px " + MONO;
    g.fillStyle = color || INK;
    g.textAlign = align || "center";
    if ("letterSpacing" in g) g.letterSpacing = (modern ? 0 : (spacing || 0)) + "px";
    g.fillText(str, x, y);
  };
  /* one crystal frame, rendered small and scaled up crunchy */
  const crystal = function (scores, x, y, size, t) {
    const c = document.createElement("canvas");
    c.width = c.height = modern ? 480 : 72;
    c.dataset.r = crystalRadii(scores).join(",");
    drawCrystal(c, t);
    g.drawImage(c, x - size / 2, y - size / 2, size, size);
  };
  const pctLine = function (s) {
    return ELS.slice().sort(function (a, b) { return s.pct[b] - s.pct[a]; })
      .filter(function (e) { return s.pct[e] > 0; })
      .map(function (e) { return CONTENT.elements[e].name.toUpperCase() + " " + s.pct[e] + "%"; }).join("  ");
  };
  text(CONTENT.meta.app.toUpperCase(), W / 2, 110, 38, INK, 700, "center", 8);
  let name = "";
  if (kind === "pair" && UI._pair) {
    const P = UI._pair;
    name = P.a.n + "-" + P.b.n;
    crystal(P.a.s, W * 0.3, 420, 380, 2.0);
    crystal(P.b.s, W * 0.7, 420, 380, 3.4);
    [[P.a, W * 0.3], [P.b, W * 0.7]].forEach(function (pr) {
      text(pr[0].n.toUpperCase(), pr[1], 680, 34, col(pr[0].s.primary), 700, "center", 4);
      text(CONTENT.elements[pr[0].s.primary].name.toUpperCase() +
        (pr[0].s.secondary ? " + " + CONTENT.elements[pr[0].s.secondary].name.toUpperCase() : ""), pr[1], 726, 22, DIM, 500, "center", 3);
    });
    text(String(P.ab.score), W / 2, 900, 150, INK, 700);
    text(CONTENT.tiers[P.ab.tier].toUpperCase(), W / 2, 970, 30, INK, 700, "center", 6);
    text(CONTENT.relations[P.ab.relation], W / 2, 1040, 26, DIM, 400);
    if (P.ab.trap) text(CONTENT.persona.trapBadge.toUpperCase(), W / 2, 1090, 22, col("fire"), 700, "center", 4);
  } else {
    const s = UI.scores;
    name = UI.profile.name || "blueprint";
    crystal(s, W / 2, 500, 560, 2.2);
    if (UI.profile.name) text(UI.profile.name.toUpperCase() + (UI.observed ? " · " + CONTENT.landing.readTag.toUpperCase() : ""),
      W / 2, 190, 30, DIM, 500, "center", 6);
    const head = isCoPrimary(s)
      ? CONTENT.elements[s.primary].name + " + " + CONTENT.elements[s.secondary].name
      : CONTENT.elements[s.primary].name;
    text(head.toUpperCase(), W / 2, 880, 84, col(s.primary), 700, "center", 10);
    text(CONTENT.elements[s.primary].archetype, W / 2, 940, 28, DIM, 400);
    text(pctLine(s), W / 2, 1010, 24, INK, 500, "center", 2);
    text(CONTENT.states[s.state].name.toUpperCase(), W / 2, 1080, 26, INK, 700, "center", 8);
    g.strokeStyle = INK; g.lineWidth = 3;
    const tw = 300; g.strokeRect(W / 2 - tw / 2, 1042, tw, 56);
  }
  text(CONTENT.image.footer.toUpperCase(), W / 2, H - 60, 18, DIM, 500, "center", 4);
  /* scanlines last, like the screen (retro only) */
  if (!modern) {
    g.fillStyle = "rgba(255,255,255,.035)";
    for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 2);
  }
  const file = "elemental-blueprint-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".png";
  cv.toBlob(function (blob) {
    if (!blob) return;
    const f = typeof File === "function" ? new File([blob], file, { type: "image/png" }) : null;
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f] }).catch(function () { /* cancelled */ });
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = file;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(CONTENT.image.saved);
  }, "image/png");
}
