/* Two overlaid pentagons with cycle arrows between both people's
   elements. Arrow color is the element doing the feeding or checking. */
function dyadPentagonSVG(a, b, edges) {
  const VORDER = ["fire", "earth", "metal", "water", "wood"];
  const cx = 180, cy = 180, R = 118, LR = R + 26;
  const f = function (n) { return n.toFixed(1); };
  const vx = {};
  VORDER.forEach(function (e, i) {
    const an = (-90 + i * 72) * Math.PI / 180;
    vx[e] = { x: cx + R * Math.cos(an), y: cy + R * Math.sin(an), lx: cx + LR * Math.cos(an), ly: cy + LR * Math.sin(an) };
  });
  const uid = "dy" + (++svgUid);
  let defs = "<defs>" + VORDER.map(function (e) {
    return '<marker id="' + uid + e + '" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">' +
      '<path d="M0,0 L8,4 L0,8 Z" style="fill:var(--' + e + ')"/></marker>';
  }).join("") + "</defs>";
  let ring = "";
  VORDER.forEach(function (e, i) {
    const p = vx[e], q = vx[VORDER[(i + 1) % 5]], r2 = vx[VORDER[(i + 2) % 5]];
    ring += '<line x1="' + f(p.x) + '" y1="' + f(p.y) + '" x2="' + f(q.x) + '" y2="' + f(q.y) + '" stroke="var(--ink)" stroke-opacity=".22" shape-rendering="crispEdges"/>';
    ring += '<line x1="' + f(p.x) + '" y1="' + f(p.y) + '" x2="' + f(r2.x) + '" y2="' + f(r2.y) + '" stroke="var(--ink)" stroke-opacity=".08" shape-rendering="crispEdges"/>';
  });
  const poly = function (sc, dash) {
    const pts = VORDER.map(function (e) {
      const k = Math.max(0.04, (sc.pct[e] || 0) / 100) * 1.6;
      const r = Math.min(1, k);
      return f(cx + (vx[e].x - cx) * r) + "," + f(cy + (vx[e].y - cy) * r);
    }).join(" ");
    return '<polygon points="' + pts + '" fill="none" stroke="var(--ink)" stroke-width="1.5"' +
      (dash ? ' stroke-dasharray="4 3"' : ' fill-opacity=".08"') + ' shape-rendering="crispEdges"/>';
  };
  /* arrows run vertex to vertex; a "same" edge rings the shared vertex */
  let arrows = "";
  edges.forEach(function (e, n) {
    const w = e.major ? 2.4 : 1.2, op = e.major ? 1 : 0.6;
    if (e.kind === "same") {
      arrows += '<rect x="' + f(vx[e.fe].x - 9 - n * 3) + '" y="' + f(vx[e.fe].y - 9 - n * 3) + '" width="' + (18 + n * 6) +
        '" height="' + (18 + n * 6) + '" fill="none" style="stroke:var(--' + e.fe + ')" stroke-width="' + w + '" opacity="' + op + '"/>';
      return;
    }
    const p = vx[e.fe], q = vx[e.te];
    const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
    const ux = dx / d, uy = dy / d;
    /* bow the line slightly so two arrows on one pair stay apart */
    const mx = (p.x + q.x) / 2 - uy * 14 * (n % 2 ? -1 : 1), my = (p.y + q.y) / 2 + ux * 14 * (n % 2 ? -1 : 1);
    arrows += '<path d="M' + f(p.x + ux * 12) + "," + f(p.y + uy * 12) + " Q" + f(mx) + "," + f(my) + " " +
      f(q.x - ux * 14) + "," + f(q.y - uy * 14) + '" fill="none" style="stroke:var(--' + e.fe + ')" stroke-width="' + w +
      '" opacity="' + op + '"' + (e.kind === "checks" ? ' stroke-dasharray="6 4"' : "") +
      ' marker-end="url(#' + uid + e.fe + ')"/>';
  });
  let labels = "";
  VORDER.forEach(function (e) {
    labels += '<rect x="' + f(vx[e].x - 3.5) + '" y="' + f(vx[e].y - 3.5) + '" width="7" height="7" style="fill:var(--' + e + ')"/>' +
      '<text x="' + f(vx[e].lx) + '" y="' + f(vx[e].ly + 4) + '" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing=".18em" style="fill:var(--' + e + ')">' +
      CONTENT.elements[e].name.toUpperCase() + "</text>";
  });
  return '<svg class="penta" viewBox="0 0 360 360" style="width:min(86vw,340px)" role="img" aria-label="' + esc(CONTENT.cycles.label) + '">' +
    defs + ring + poly(a, false) + poly(b, true) + arrows + labels + "</svg>";
}

function edgeLines(edges, aName, bName) {
  const C = CONTENT.cycles;
  const en = function (e) { return CONTENT.elements[e].name; };
  return edges.map(function (e) {
    const who = function (side) { return side === "a" ? aName : bName; };
    if (e.kind === "same") return fill(C.same, { a: aName, b: bName, e: en(e.fe) });
    return fill(e.kind === "feeds" ? C.feeds : C.checks, { a: who(e.from), ea: en(e.fe), b: who(e.to), eb: en(e.te) });
  });
}

function renderCompare(other, otherName, otherObserved) {
  const c = CONTENT.compare;
  UI._cmp = { scores: UI.scores, args: [other, otherName, otherObserved] };
  /* "you" is the user's own result: if the open one is a read of
     someone else and the saved one is not, turn the pairing around */
  let A = { s: UI.scores, n: UI.profile.name || c.unnamedSelf };
  let B = { s: other, n: otherName || c.unnamedOther };
  if (UI.observed && !otherObserved) { const t = A; A = B; B = t; }
  const ab = dyadScore(A.s, B.s);
  const ba = dyadScore(B.s, A.s);
  const edges = cycleEdges(A.s, B.s);
  const rep = pairingReport(A.s, B.s, A.n, B.n);
  UI._pair = { a: A, b: B, ab: ab };
  const tag = function (s) {
    return '<p class="mono" style="font-size:12px;color:var(--ink-70);text-align:center">' +
      CONTENT.elements[s.primary].name + " " + s.pct[s.primary] + "%" +
      (s.secondary ? " · " + CONTENT.elements[s.secondary].name + " " + s.pct[s.secondary] + "%" : "") +
      " · " + CONTENT.states[s.state].name + "</p>";
  };
  $("#cmpbox").innerHTML =
    '<div class="pcard">' +
      orbitHTML(A.s, B.s, edges, CONTENT.cycles.orbitAria) +
      '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px">' +
        '<div style="width:min(80vw,220px)"><p class="lbl" style="text-align:center">' + esc(A.n) + "</p>" +
          pentagonSVG(A.s, { size: 200, aria: A.n + " element chart" }) + tag(A.s) + "</div>" +
        '<div style="width:min(80vw,220px)"><p class="lbl" style="text-align:center">' + esc(B.n) + "</p>" +
          pentagonSVG(B.s, { size: 200, aria: B.n + " element chart" }) + tag(B.s) + "</div>" +
      "</div>" +
      dyadCardHTML(esc(A.n) + c.withWord + esc(B.n), ab) +
      dyadCardHTML(esc(B.n) + c.withWord + esc(A.n), ba) +
      '<p class="micro" style="margin-top:12px">' + c.sideNote + "</p>" +
      '<div class="section"><p class="lbl">' + CONTENT.cycles.label + "</p>" +
        '<div class="rule" style="background:var(--' + A.s.primary + ')"></div>' +
        dyadPentagonSVG(A.s, B.s, edges) +
        '<ul class="plain" style="margin-top:10px">' + edgeLines(edges, A.n, B.n).map(function (x) {
          return "<li>" + esc(x) + "</li>";
        }).join("") + "</ul>" +
        '<p class="micro" style="margin-top:8px">' + esc(fill(CONTENT.cycles.legend, { a: A.n, b: B.n })) + "</p>" +
      "</div>" +
      '<div class="section"><p class="lbl">' + CONTENT.report.label + "</p>" +
        '<div class="rule" style="background:var(--' + B.s.primary + ')"></div>' + reportHTML(rep) + "</div>" +
      '<div class="footrow" style="margin-top:18px"><button class="linkbtn" id="pairimg">' + CONTENT.image.pairButton + "</button></div>" +
      '<p class="micro" style="margin-top:12px">' + c.footer + "</p>" +
    "</div>";
  $("#pairimg").addEventListener("click", function () { saveCardImage("pair"); });
  mountCrystals();
}

function bindCompare() {
  document.querySelectorAll("[data-cmp]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const p = loadProfiles()[Number(btn.dataset.cmp)];
      if (!p) return;
      try { renderCompare(hydrateScores(p.scores), p.name || "", p.observed); }
      catch (e) { /* corrupt entry; ignore */ }
    });
  });
  $("#cmpform").addEventListener("submit", function (ev) {
    ev.preventDefault();
    const s = decodeBlueprint($("#cmpin").value);
    if (!s) { $("#cmpbad").hidden = false; return; }
    $("#cmpbad").hidden = true;
    renderCompare(s, "", false);
  });
}

/* ---------- ask: follow-up questions via the local companion ----------
   The static app stays self-contained; when server.js is running it
   bridges /api/ask to the Claude Code CLI on the user's own login. */
function askSectionHTML() {
  const a = CONTENT.ask;
  return '<div class="section" id="asksec"><p class="lbl">' + a.label + "</p>" +
    '<div class="rule" style="background:var(--' + UI.scores.primary + ')"></div>' +
    '<p class="micro" id="askintro">' + a.intro + "</p>" +
    '<div id="asklog"></div>' +
    '<form id="askform" hidden><div class="askrow">' +
      '<input class="askin" id="askin" maxlength="400" autocomplete="off" placeholder="' + a.placeholder + '">' +
      '<button class="btn sm" id="askbtn" type="submit">' + a.button + "</button>" +
    "</div></form>" +
    '<p class="micro" id="askstatus" hidden></p></div>';
}

function buildAskPrompt(question) {
  const canon = ELS.map(function (e) {
    const el = CONTENT.elements[e];
    return el.name + " (" + el.archetype + "): " + el.drive + " Stress signature: " + el.stress.name + ".";
  }).join("\n");
  const hist = UI.askLog.slice(-3).map(function (x) {
    return "Q: " + x.q + "\nA: " + x.a;
  }).join("\n\n");
  return CONTENT.ask.rules +
    "\n\nTHE FRAMEWORK\n" + canon +
    "\n\nTHE USER'S RESULT (JSON)\n" + JSON.stringify(publicScores(UI.scores)) +
    (isCoPrimary(UI.scores) ? "\nThe user's top two elements are exactly tied: treat them as co-primary, neither leading." : "") +
    (UI.profile.name ? "\nThe user goes by " + UI.profile.name + "." : "") +
    (UI._persona ? "\n\nA PUBLIC FIGURE JUST READ (public persona) AND THE COMPUTED PAIRING\n" +
      JSON.stringify({
        person: {
          name: UI._persona.read.name,
          pct: UI._persona.read.scores.pct,
          primary: UI._persona.read.scores.primary,
          secondary: UI._persona.read.scores.secondary
        },
        dyad: UI._persona.dyad
      }) : "") +
    (hist ? "\n\nRECENT EXCHANGES\n" + hist : "") +
    "\n\nTHE USER'S QUESTION\n" + question;
}

function renderAskLog() {
  const box = $("#asklog");
  if (!box) return;
  box.innerHTML = UI.askLog.map(function (x) {
    const paras = esc(x.a).split(/\n\n+/).map(function (p) {
      return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
    }).join("");
    return '<p class="askq">&gt; ' + esc(x.q) + '</p><div class="aska">' + paras + "</div>";
  }).join("");
}

/* One health check gates both companion sections (Ask + Read anyone) */
function setupCompanion() {
  renderAskLog();
  renderPersona();
  bindAsk();
  bindPersona();
  const gen = UI._gen; /* callbacks may land after this screen is gone */
  const offline = function () {
    if (UI._gen !== gen) return;
    $("#askintro").textContent = CONTENT.ask.offline;
    $("#personaintro").textContent = CONTENT.ask.offline;
  };
  if (window.location.protocol === "file:") { offline(); return; }
  const ctl = new AbortController();
  const t = setTimeout(function () { ctl.abort(); }, 2500);
  fetch("/api/health", { signal: ctl.signal }).then(function (r) {
    clearTimeout(t);
    if (UI._gen !== gen) return;
    if (r.ok) { $("#askform").hidden = false; $("#personaform").hidden = false; }
    else offline();
  }, function () {
    clearTimeout(t);
    offline();
  });
}

function bindAsk() {
  const a = CONTENT.ask;
  const form = $("#askform"), input = $("#askin"), btn = $("#askbtn"),
        status = $("#askstatus");

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    const q = input.value.trim();
    if (!q || UI._askBusy) return;
    UI._askBusy = true;
    const gen = UI._gen; /* a re-render orphans this request; drop its result */
    btn.disabled = true;
    status.hidden = false;
    status.textContent = a.thinking;
    const ctl2 = new AbortController();
    const kt = setTimeout(function () { ctl2.abort(); }, 180000);
    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: buildAskPrompt(q) }),
      signal: ctl2.signal
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (UI._gen !== gen) return;
      if (j && j.answer) {
        UI.askLog.push({ q: q, a: j.answer });
        input.value = "";
        status.hidden = true;
        renderAskLog();
      } else {
        status.textContent = a.error;
      }
    }).catch(function () {
      if (UI._gen !== gen) return;
      status.textContent = a.error;
    }).finally(function () {
      clearTimeout(kt);
      /* after a re-render the flags belong to the new screen's requests */
      if (UI._gen !== gen) return;
      UI._askBusy = false;
      btn.disabled = false;
    });
  });
}

/* ---------- read anyone: persona reads + dyad scoring ---------- */
function personaSectionHTML() {
  const c = CONTENT.persona;
  return '<div class="section" id="personasec"><p class="lbl">' + c.label + "</p>" +
    '<div class="rule" style="background:var(--' + UI.scores.primary + ')"></div>' +
    '<p class="micro" id="personaintro">' + c.intro + "</p>" +
    '<form id="personaform" hidden><div class="askrow">' +
      '<input class="askin" id="personain" maxlength="60" autocomplete="off" placeholder="' + c.placeholder + '">' +
      '<button class="btn sm" id="personabtn" type="submit">' + c.button + "</button>" +
    "</div></form>" +
    '<p class="micro" id="personastatus" hidden></p>' +
    '<div id="personabox"></div></div>';
}

function buildPersonaPrompt(name) {
  return CONTENT.persona.rules + "\n\nTHE SUBJECT\n" + name +
    "\n\nReturn ONLY the JSON object, nothing else.";
}

function renderPersona() {
  const box = $("#personabox");
  if (!box) return;
  if (!UI._persona) { box.innerHTML = ""; return; }
  const c = CONTENT.persona;
  const r = UI._persona.read, d = UI._persona.dyad;
  const sec = r.scores.secondary;
  box.innerHTML =
    '<div class="pcard">' +
      '<p class="display" style="font-size:19px;color:var(--' + r.scores.primary + ')">' + esc(r.name) + "</p>" +
      (r.knownFor ? '<p class="micro" style="margin-top:4px">' + esc(r.knownFor) + "</p>" : "") +
      '<div style="margin:14px 0 4px;text-align:center">' +
        pentagonSVG(r.scores, { size: 230, aria: r.name + " element chart" }) + "</div>" +
      '<p class="mono" style="font-size:13px;color:var(--ink-70);text-align:center">' +
        (isCoPrimary(r.scores)
          ? CONTENT.elements[r.scores.primary].name + " + " + CONTENT.elements[sec].name +
            " " + r.scores.pct[r.scores.primary] + "% · " + CONTENT.reveal.coPrimaryLabel
          : CONTENT.elements[r.scores.primary].name + " " + r.scores.pct[r.scores.primary] + "%" +
            (sec ? " · " + CONTENT.elements[sec].name + " " + r.scores.pct[sec] + "%" : "")) + "</p>" +
      '<ul class="plain" style="margin-top:12px">' +
        r.evidence.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
      (r.caveat ? '<p class="micro" style="margin-top:10px">' + esc(r.caveat) + "</p>" : "") +
      dyadCardHTML(c.youX + esc(r.name), d) +
      '<p class="micro" style="margin-top:12px">' + c.footer + "</p>" +
    "</div>";
}

function bindPersona() {
  const c = CONTENT.persona;
  const form = $("#personaform"), input = $("#personain"), btn = $("#personabtn"),
        status = $("#personastatus");

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    const name = input.value.trim();
    if (!name || UI._personaBusy) return;
    UI._personaBusy = true;
    const gen = UI._gen; /* a re-render orphans this request; drop its result */
    btn.disabled = true;
    status.hidden = false;
    status.textContent = c.thinking;
    const ctl = new AbortController();
    const kt = setTimeout(function () { ctl.abort(); }, 180000);
    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: buildPersonaPrompt(name), search: true }),
      signal: ctl.signal
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (UI._gen !== gen) return;
      const parsed = j && j.answer ? parsePersona(j.answer) : null;
      if (!parsed) { status.textContent = c.error; return; }
      if (parsed.error) { status.textContent = c.unknown; return; }
      UI._persona = { read: parsed, dyad: dyadScore(UI.scores, parsed.scores) };
      input.value = "";
      status.hidden = true;
      renderPersona();
    }).catch(function () {
      if (UI._gen !== gen) return;
      status.textContent = c.error;
    }).finally(function () {
      clearTimeout(kt);
      /* after a re-render the flags belong to the new screen's requests */
      if (UI._gen !== gen) return;
      UI._personaBusy = false;
      btn.disabled = false;
    });
  });
}

/* ---------- footer + toast ---------- */
function renderFooter() {
  const f = CONTENT.footer;
  const hasResult = !!UI.scores && (UI.screen === "blueprint" || UI.screen === "reveal");
  $("#foot").innerHTML =
    (hasResult
      ? '<div class="footrow">' +
          '<button class="linkbtn" id="f-retake">' + f.retake + "</button>" +
          '<button class="linkbtn" id="f-copy">' + f.copyCode + "</button>" +
          '<button class="linkbtn" id="f-img">' + CONTENT.image.button + "</button>" +
          '<button class="linkbtn" id="f-results">' + f.results + "</button>" +
          '<button class="linkbtn" id="f-erase">' + f.erase + "</button>" +
        "</div>"
      : "") +
    '<p class="disclaimer">' + CONTENT.meta.disclaimer + " " + CONTENT.meta.privacyNote + "</p>";

  if (hasResult) {
    $("#f-retake").addEventListener("click", function () {
      if (!window.confirm(f.confirmRetake)) return;
      UI.picks = {}; UI.alsos = {}; UI.optionOrder = {}; UI.qIndex = 0; UI.lately = {};
      go("quiz");
    });
    $("#f-results").addEventListener("click", function () { go("landing"); });
    $("#f-img").addEventListener("click", function () { saveCardImage("single"); });
    $("#f-copy").addEventListener("click", function () {
      const code = encodeBlueprint(UI.scores);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function () { toast(f.copied); }, function () { toast(code); });
      } else { toast(code); }
    });
    $("#f-erase").addEventListener("click", function () {
      if (!window.confirm(f.confirmErase)) return;
      eraseAll();
      window.location.reload();
    });
  }
}

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
}

/* ---------- init ---------- */
(function init() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("debug")) {
    runFixtures();
    window.EB = { scoreAnswers: scoreAnswers, encodeBlueprint: encodeBlueprint, decodeBlueprint: decodeBlueprint,
      manualScores: manualScores, isCoPrimary: isCoPrimary, FIXTURES: FIXTURES, CONTENT: CONTENT };
  }
  document.documentElement.dataset.look = storedLook();
  renderLook();
  bootSequence();
  const saved = loadAll();
  if (saved && saved.meta && saved.meta.version === 1 && saved.scores && saved.scores.primary &&
      saved.scores.pct && saved.scores.maturity) {
    try {
      UI.profile = Object.assign(UI.profile, saved.profile || {});
      UI.observed = !!saved.observed;
      UI.scores = hydrateScores(saved.scores);
      go("blueprint");
    } catch (e) {
      /* structurally corrupt payload: never a blank page */
      go("landing");
    }
  } else {
    go("landing");
  }
})();
</script>
